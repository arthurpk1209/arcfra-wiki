services:
  # 生產環境: 建置靜態站點後用 Nginx 提供服務
  arcfra-wiki:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arcfra-wiki
    ports:
      - "8080:80"
    restart: unless-stopped

  # 開發環境: 掛載原始碼,熱更新預覽(內容改了瀏覽器自動刷新)
  # 用法: docker compose --profile dev up arcfra-wiki-dev
  arcfra-wiki-dev:
    image: node:20-alpine
    container_name: arcfra-wiki-dev
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --port 3000"
